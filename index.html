<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet">

  <title>Frontend Mentor | Product preview card component</title>
</head>

<body>
  <!-- the wrapper below is what gets centred in the grid. So for smaller screen sizes it touches the body's edges -->
  <!-- thus margin is given to the main inside the wrapper which is always respected (enables scroll) -->
  <!-- without wrapper the main itself would have touched body's edges without respecting margins. -->
  <div class="wrapper">
    <main>
      <div class="product-info">
        <h1 class="product-name">Gabrielle Essence Eau De Parfum</h1>
        <p class="product-type">Perfume</p>
        <p class="product-descr">
          A floral, solar and voluptuous interpretation composed by Olivier Polge, Perfumer-Creator for the House of
          CHANEL.
        </p>
        <div class="price">
          <data class="current-price">$149.99</data>
          <data class="striked-price">$169.99</data>
        </div>
        <button type="button" class="add-to-cart-btn">
          <img src="images/icon-cart.svg" alt="" />
          Add to Cart
        </button>
      </div>
      <figure class="product-img">
        <img class="mobile-img" src="images/image-product-mobile.jpg" alt="Gabrielle Essence Eau De Parfum image" />
        <img class="desktop-img" src="images/image-product-desktop.jpg" alt="Gabrielle Essence Eau De Parfum image" />
      </figure>
    </main>
  </div>
</body>

</html>
